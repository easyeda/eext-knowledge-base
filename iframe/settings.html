<!doctype html>
<html lang="zh-Hans">
<head>
	<title>设置</title>
	<meta charset="utf-8" />
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
		h2 { font-size: 16px; color: #333; margin-bottom: 16px; }
		.field { margin-bottom: 12px; }
		.field label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
		.field input, .field select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; outline: none; background: #fff; }
		.field input:focus, .field select:focus { border-color: #4a90d9; }
		.field .hint { font-size: 11px; color: #999; margin-top: 2px; }
		.actions { margin-top: 16px; display: flex; gap: 8px; }
		.btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
		.btn-primary { background: #4a90d9; color: #fff; }
		.btn-primary:hover { background: #357abd; }
		#status { margin-top: 8px; font-size: 12px; color: #28a745; min-height: 18px; }
		.advanced-section { margin-top: 12px; border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; background: #fafafa; }
		.advanced-section summary { font-size: 13px; color: #555; cursor: pointer; padding: 4px 0; }
		.advanced-section .field { margin-top: 10px; }
		.checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #333; cursor: pointer; }
		.checkbox-label input[type="checkbox"] { width: auto; margin: 0; }
	</style>
</head>
<body>
	<h2>⚙️ AI 助手设置</h2>
	<div class="field">
		<label>API 类型</label>
		<select id="cfg-apitype">
			<option value="openai">OpenAI 兼容格式（MiniMax、DeepSeek 等）</option>
			<option value="anthropic">Anthropic 格式（Claude 等）</option>
		</select>
	</div>
	<div class="field">
		<label>API Key</label>
		<input type="password" id="cfg-apikey" placeholder="输入 API Key" />
	</div>
	<div class="field">
		<label>模型名称</label>
		<input type="text" id="cfg-model" placeholder="输入模型名称" />
	</div>
	<div class="field">
		<label>API 地址</label>
		<input type="text" id="cfg-baseurl" placeholder="例如 https://api.openai.com/v1" />
	</div>
	<details class="advanced-section">
		<summary>高级设置</summary>
		<div class="field">
			<label>Embedding 模型</label>
			<input type="text" id="cfg-embedding-model" placeholder="Xenova/bge-large-zh-v1.5" />
			<div class="hint">用于文档向量化的模型，留空使用默认 Xenova/bge-large-zh-v1.5</div>
		</div>
		<div class="field">
			<label>本地 AI 模型</label>
			<input type="text" id="cfg-local-model" placeholder="onnx-community/Qwen2.5-0.5B-Instruct" />
			<div class="hint">本地推理模型，留空使用默认 onnx-community/Qwen2.5-0.5B-Instruct</div>
		</div>
		<div class="field">
			<label>模型镜像站</label>
			<input type="text" id="cfg-modelmirror" placeholder="https://hf-mirror.com" />
			<div class="hint">用于下载 Embedding 和本地 AI 模型，留空使用默认 https://hf-mirror.com</div>
		</div>
		<div class="field">
			<label class="checkbox-label">
				<input type="checkbox" id="cfg-enable-thinking" />
				启用思考模式
			</label>
			<div class="hint">开启后在 API 请求中添加 enable_thinking 参数（适用于 Qwen3 等支持思考模式的模型）</div>
		</div>
		<div class="field">
			<label>上下文轮数</label>
			<input type="number" id="cfg-history-rounds" min="0" max="20" placeholder="3" />
			<div class="hint">携带最近 N 轮对话作为上下文，留空默认 3 轮，设为 0 则不携带历史</div>
		</div>
	</details>
	<div class="actions">
		<button class="btn btn-primary" id="save-btn">💾 保存</button>
	</div>
	<div id="status"></div>
	<script>
		var edaObj = (typeof eda !== 'undefined') ? eda : (window.parent && window.parent.eda);
		function t(tag) {
			if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag);
			return tag;
		}
		// Apply i18n to page elements
		document.title = t('AI Assistant Settings');
		document.querySelector('h2').textContent = '⚙️ ' + t('AI Assistant Settings');
		var labels = document.querySelectorAll('.field label');
		labels[0].textContent = t('API Type');
		var apiTypeOptions = document.querySelectorAll('#cfg-apitype option');
		apiTypeOptions[0].textContent = t('OpenAI Compatible Format');
		apiTypeOptions[1].textContent = t('Anthropic Format');
		labels[1].textContent = t('API Key');
		document.getElementById('cfg-apikey').placeholder = t('Input API Key');
		labels[2].textContent = t('Model Name');
		document.getElementById('cfg-model').placeholder = t('Input model name');
		labels[3].textContent = t('API URL');
		document.getElementById('cfg-baseurl').placeholder = t('API URL Placeholder');
		document.querySelector('.advanced-section summary').textContent = t('Advanced Settings');
		var advancedLabels = document.querySelectorAll('.advanced-section .field label');
		advancedLabels[0].textContent = t('Embedding Model');
		document.querySelectorAll('.advanced-section .field .hint')[0].textContent = t('Embedding Model Hint');
		advancedLabels[1].textContent = t('Local AI Model');
		document.querySelectorAll('.advanced-section .field .hint')[1].textContent = t('Local AI Model Hint');
		advancedLabels[2].textContent = t('Model Mirror');
		document.querySelectorAll('.advanced-section .field .hint')[2].textContent = t('Model Mirror Hint');
		document.querySelector('.checkbox-label').innerHTML = '<input type="checkbox" id="cfg-enable-thinking" /> ' + t('Enable Thinking Mode') + ' ';
		document.querySelectorAll('.advanced-section .field .hint')[3].textContent = t('Enable Thinking Mode Hint');
		advancedLabels[3].textContent = t('Context Rounds');
		document.querySelectorAll('.advanced-section .field .hint')[4].textContent = t('Context Rounds Hint');
		document.getElementById('save-btn').textContent = '💾 ' + t('Save');

		var STORAGE_KEY = 'ai_assistant_config';
		var cfgApiType = document.getElementById('cfg-apitype');
		var cfgApiKey = document.getElementById('cfg-apikey');
		var cfgModel = document.getElementById('cfg-model');
		var cfgBaseURL = document.getElementById('cfg-baseurl');
		var cfgEmbeddingModel = document.getElementById('cfg-embedding-model');
		var cfgLocalModel = document.getElementById('cfg-local-model');
		var cfgModelMirror = document.getElementById('cfg-modelmirror');
		var cfgEnableThinking = document.getElementById('cfg-enable-thinking');
		var cfgHistoryRounds = document.getElementById('cfg-history-rounds');
		var saveBtn = document.getElementById('save-btn');
		var statusEl = document.getElementById('status');

		// 加载
		try {
			var raw = localStorage.getItem(STORAGE_KEY);
			if (raw) {
				var obj = JSON.parse(raw);
				cfgApiType.value = obj.apiType || 'openai';
				cfgApiKey.value = obj.apiKey || '';
				cfgModel.value = obj.model || '';
				cfgBaseURL.value = obj.baseURL || '';
				cfgEmbeddingModel.value = obj.embeddingModel || '';
				cfgLocalModel.value = obj.localModel || '';
				cfgModelMirror.value = obj.modelMirror || '';
				cfgEnableThinking.checked = !!obj.enableThinking;
				cfgHistoryRounds.value = obj.historyRounds !== undefined ? String(obj.historyRounds) : '';
			}
		} catch(e) {}

		// 保存
		saveBtn.addEventListener('click', function() {
			var config = {
				apiType: cfgApiType.value,
				apiKey: cfgApiKey.value.trim(),
				model: cfgModel.value.trim(),
				baseURL: cfgBaseURL.value.trim(),
				embeddingModel: cfgEmbeddingModel.value.trim(),
				localModel: cfgLocalModel.value.trim(),
				modelMirror: cfgModelMirror.value.trim(),
				enableThinking: cfgEnableThinking.checked,
				historyRounds: cfgHistoryRounds.value.trim() === '' ? undefined : parseInt(cfgHistoryRounds.value, 10),
			};
			localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
			statusEl.textContent = '✅ ' + t('Settings Saved');
			setTimeout(function() { statusEl.textContent = ''; }, 3000);
			try {
				eda.sys_Message.showToastMessage(t('Settings Saved Toast'),"success", 3);
			} catch(e) {}
		});
	</script>
</body>
</html>
