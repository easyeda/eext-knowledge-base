<!doctype html>
<html lang="zh-Hans">
<head>
	<title>设置</title>
	<meta charset="utf-8" />
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
		h2 { font-size: 16px; color: #333; margin-bottom: 16px; }
		.field { margin-bottom: 12px; }
		.field label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
		.field input, .field select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; outline: none; background: #fff; }
		.field input:focus, .field select:focus { border-color: #4a90d9; }
		.field .hint { font-size: 11px; color: #999; margin-top: 2px; }
		.actions { margin-top: 16px; display: flex; gap: 8px; }
		.btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
		.btn-primary { background: #4a90d9; color: #fff; }
		.btn-primary:hover { background: #357abd; }
		#status { margin-top: 8px; font-size: 12px; color: #28a745; min-height: 18px; }
		.advanced-section { margin-top: 12px; border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; background: #fafafa; }
		.advanced-section summary { font-size: 13px; color: #555; cursor: pointer; padding: 4px 0; }
		.advanced-section .field { margin-top: 10px; }
		.checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #333; cursor: pointer; }
		.checkbox-label input[type="checkbox"] { width: auto; margin: 0; }
	</style>
</head>
<body>
	<h2>⚙️ AI 助手设置</h2>
	<div class="field">
		<label data-i18n="API Type">API 类型</label>
		<select id="cfg-apitype">
			<option value="openai" data-i18n="OpenAI Compatible Format">OpenAI 兼容格式（MiniMax、DeepSeek 等）</option>
			<option value="anthropic" data-i18n="Anthropic Format">Anthropic 格式（Claude 等）</option>
		</select>
	</div>
	<div class="field">
		<label data-i18n="API Key">API Key</label>
		<input type="password" id="cfg-apikey" placeholder="输入 API Key" data-i18n-placeholder="Input API Key" />
	</div>
	<div class="field">
		<label data-i18n="Model Name">模型名称</label>
		<input type="text" id="cfg-model" placeholder="输入模型名称" data-i18n-placeholder="Input model name" />
	</div>
	<div class="field">
		<label data-i18n="API URL">API 地址</label>
		<input type="text" id="cfg-baseurl" placeholder="例如 https://api.openai.com/v1" data-i18n-placeholder="API URL Placeholder" />
	</div>
	<details class="advanced-section">
		<summary data-i18n="Advanced Settings">高级设置</summary>
		<div class="field">
			<label data-i18n="Embedding Model">Embedding 模型</label>
			<input type="text" id="cfg-embedding-model" placeholder="Xenova/bge-large-zh-v1.5" />
			<div class="hint" data-i18n="Embedding Model Hint">用于文档向量化的模型，留空使用默认 Xenova/bge-large-zh-v1.5</div>
		</div>
		<div class="field">
			<label data-i18n="Local AI Model">本地 AI 模型</label>
			<input type="text" id="cfg-local-model" placeholder="onnx-community/Qwen2.5-0.5B-Instruct" />
			<div class="hint" data-i18n="Local AI Model Hint">本地推理模型，留空使用默认 onnx-community/Qwen2.5-0.5B-Instruct</div>
		</div>
		<div class="field">
			<label data-i18n="Model Mirror">模型镜像站</label>
			<input type="text" id="cfg-modelmirror" placeholder="https://hf-mirror.com" />
			<div class="hint" data-i18n="Model Mirror Hint">用于下载 Embedding 和本地 AI 模型，留空使用默认 https://hf-mirror.com</div>
		</div>
		<div class="field">
			<label class="checkbox-label">
				<input type="checkbox" id="cfg-enable-thinking" />
				<span data-i18n="Enable Thinking Mode">启用思考模式</span>
			</label>
			<div class="hint" data-i18n="Enable Thinking Mode Hint">开启后在 API 请求中添加 enable_thinking 参数（适用于 Qwen3 等支持思考模式的模型）</div>
		</div>
		<div class="field">
			<label data-i18n="Context Rounds">上下文轮数</label>
			<input type="number" id="cfg-history-rounds" min="0" max="20" placeholder="3" />
			<div class="hint" data-i18n="Context Rounds Hint">携带最近 N 轮对话作为上下文，留空默认 3 轮，设为 0 则不携带历史</div>
		</div>
	</details>
	<div class="actions">
		<button class="btn btn-primary" id="save-btn" data-i18n="Save">💾 保存</button>
	</div>
	<div id="status"></div>
	<script>
		var edaObj = (typeof eda !== 'undefined') ? eda : (window.parent && window.parent.eda);
		var _i18n = {"About":"关于","EasyEDA extension SDK v":"嘉立创EDA 扩展 SDK v${1}","Open AI Assistant":"打开 AI 知识库","Settings...":"设置...","About...":"关于...","AI Knowledge Base Assistant":"AI 知识库助手","Knowledge Base":"知识库","Import Markdown Files":"导入 Markdown 文件","Clear Knowledge Base":"清空知识库","Mode:":"模式:","Online AI Q&A":"在线AI问答","Online AI Q&A Tooltip":"使用在线 AI API 生成回答","Local AI":"本地AI","Local AI Tooltip":"使用本地AI模型生成回答（无需API Key）","Keyword Search":"关键词检索","Keyword Search Tooltip":"仅检索知识库，返回匹配片段","Input your question...":"输入你的问题...","Send":"发送","Stop":"停止","Visit Online Document":"访问在线文档","AI Assistant Settings":"AI 助手设置","API Type":"API 类型","OpenAI Compatible Format":"OpenAI 兼容格式（MiniMax、DeepSeek 等）","Anthropic Format":"Anthropic 格式（Claude 等）","API Key":"API Key","Input API Key":"输入 API Key","Model Name":"模型名称","Input model name":"输入模型名称","API URL":"API 地址","API URL Placeholder":"例如 https://api.openai.com/v1","Advanced Settings":"高级设置","Embedding Model":"Embedding 模型","Embedding Model Hint":"用于文档向量化的模型，留空使用默认 Xenova/bge-large-zh-v1.5","Local AI Model":"本地 AI 模型","Local AI Model Hint":"本地推理模型，留空使用默认 onnx-community/Qwen2.5-0.5B-Instruct","Model Mirror":"模型镜像站","Model Mirror Hint":"用于下载 Embedding 和本地 AI 模型，留空使用默认 https://hf-mirror.com","Enable Thinking Mode":"启用思考模式","Enable Thinking Mode Hint":"开启后在 API 请求中添加 enable_thinking 参数（适用于 Qwen3 等支持思考模式的模型）","Context Rounds":"上下文轮数","Context Rounds Hint":"携带最近 N 轮对话作为上下文，留空默认 3 轮，设为 0 则不携带历史","Save":"保存","Settings Saved":"已保存，重新打开助手窗口生效","Settings Saved Toast":"设置已保存，重新打开助手窗口生效","Keyword search uses a local index. First use or after document changes, the index needs to be created, which may take a moment. Build index now?":"关键词检索使用本地索引。首次使用或文档变更后需要创建索引，可能需要一点时间。是否立即构建索引？","Build Search Index":"构建搜索索引","Build":"构建","Rebuild search index? This may take a moment.":"确定重建搜索索引？可能需要一点时间。","Rebuild Search Index":"重建搜索索引","Rebuild":"重建","Rebuild Index":"重建索引","Rebuild Index Tooltip":"重建本地搜索索引","Building index, please wait...":"正在构建索引，请稍候...","Search index built (${1} chunks, ${2}s).":"搜索索引已构建（${1} 个文档块，${2} 秒）。","Index built":"索引已构建","Knowledge base is empty, nothing to index.":"知识库为空，无需构建索引。","Found ${1} matching fragments":"找到 ${1} 个匹配片段","Click to preview":"点击预览"};
		function t(tag, ...args) {
			if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag, undefined, undefined, ...args);
			var text = _i18n[tag] || tag;
			for (var i = 0; i < args.length; i++) text = text.replace('${' + (i+1) + '}', args[i]);
			return text;
		}
		function applyI18n() {
			var els = document.querySelectorAll('[data-i18n]');
			for (var i = 0; i < els.length; i++) { var k = els[i].getAttribute('data-i18n'); els[i].textContent = t(k); }
			var titles = document.querySelectorAll('[data-i18n-title]');
			for (var i = 0; i < titles.length; i++) { var k = titles[i].getAttribute('data-i18n-title'); titles[i].title = t(k); }
			var phs = document.querySelectorAll('[data-i18n-placeholder]');
			for (var i = 0; i < phs.length; i++) { var k = phs[i].getAttribute('data-i18n-placeholder'); phs[i].placeholder = t(k); }
		}
		applyI18n();
		// Apply i18n to elements with special formatting (emojis, innerHTML)
		document.title = t('AI Assistant Settings');
		document.querySelector('h2').textContent = '⚙️ ' + t('AI Assistant Settings');
		document.querySelector('.checkbox-label').innerHTML = '<input type="checkbox" id="cfg-enable-thinking" /> <span data-i18n="Enable Thinking Mode">' + t('Enable Thinking Mode') + '</span> ';
		document.getElementById('save-btn').textContent = '💾 ' + t('Save');

		var STORAGE_KEY = 'ai_assistant_config';
		var cfgApiType = document.getElementById('cfg-apitype');
		var cfgApiKey = document.getElementById('cfg-apikey');
		var cfgModel = document.getElementById('cfg-model');
		var cfgBaseURL = document.getElementById('cfg-baseurl');
		var cfgEmbeddingModel = document.getElementById('cfg-embedding-model');
		var cfgLocalModel = document.getElementById('cfg-local-model');
		var cfgModelMirror = document.getElementById('cfg-modelmirror');
		var cfgEnableThinking = document.getElementById('cfg-enable-thinking');
		var cfgHistoryRounds = document.getElementById('cfg-history-rounds');
		var saveBtn = document.getElementById('save-btn');
		var statusEl = document.getElementById('status');

		// 加载
		try {
			var raw = localStorage.getItem(STORAGE_KEY);
			if (raw) {
				var obj = JSON.parse(raw);
				cfgApiType.value = obj.apiType || 'openai';
				cfgApiKey.value = obj.apiKey || '';
				cfgModel.value = obj.model || '';
				cfgBaseURL.value = obj.baseURL || '';
				cfgEmbeddingModel.value = obj.embeddingModel || '';
				cfgLocalModel.value = obj.localModel || '';
				cfgModelMirror.value = obj.modelMirror || '';
				cfgEnableThinking.checked = !!obj.enableThinking;
				cfgHistoryRounds.value = obj.historyRounds !== undefined ? String(obj.historyRounds) : '';
			}
		} catch(e) {}

		// 保存
		saveBtn.addEventListener('click', function() {
			var config = {
				apiType: cfgApiType.value,
				apiKey: cfgApiKey.value.trim(),
				model: cfgModel.value.trim(),
				baseURL: cfgBaseURL.value.trim(),
				embeddingModel: cfgEmbeddingModel.value.trim(),
				localModel: cfgLocalModel.value.trim(),
				modelMirror: cfgModelMirror.value.trim(),
				enableThinking: cfgEnableThinking.checked,
				historyRounds: cfgHistoryRounds.value.trim() === '' ? undefined : parseInt(cfgHistoryRounds.value, 10),
			};
			localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
			statusEl.textContent = '✅ ' + t('Settings Saved');
			setTimeout(function() { statusEl.textContent = ''; }, 3000);
			try {
				eda.sys_Message.showToastMessage(t('Settings Saved Toast'),"success", 3);
			} catch(e) {}
		});
	</script>
</body>
</html>
