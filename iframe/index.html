<!doctype html>
<html lang="zh-Hans">
<head>
	<title>AI 知识库助手</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="/iframe/style.css" />
</head>
<body>
	<div id="app">
		<div id="sidebar">
			<h3>📚 知识库</h3>
			<div id="upload-area">
				<label for="file-input" class="upload-btn">📄 导入 Markdown 文件</label>
				<input type="file" id="file-input" accept=".md,.markdown,.txt" multiple />
			</div>
			<div id="doc-list"></div>
			<div id="doc-stats"></div>
			<button id="clear-kb" class="btn-danger" style="display:none;" data-i18n="Clear Knowledge Base">清空知识库</button>
		</div>
		<div id="main">
			<div id="mode-bar">
				<span class="mode-label" data-i18n="Mode:">模式:</span>
				<button id="mode-api" class="mode-btn active" title="使用在线 AI API 生成回答" data-i18n-title="Online AI Q&A Tooltip">🌐 在线AI问答</button>
				<button id="mode-local" class="mode-btn" title="使用本地AI模型生成回答（无需API Key）" data-i18n-title="Local AI Tooltip">🖥️ 本地AI</button>
				<button id="mode-index" class="mode-btn" title="仅检索知识库，返回匹配片段" data-i18n-title="Keyword Search Tooltip">🔍 关键词检索</button>
			</div>
			<div id="chat-messages"></div>
			<div id="input-area">
				<textarea id="user-input" placeholder="输入你的问题..." data-i18n-placeholder="Input your question..." rows="2"></textarea>
				<button id="send-btn" data-i18n="Send">发送</button>
				<button id="stop-btn" style="display:none;" data-i18n="Stop">停止</button>
			</div>
		</div>
	</div>
	<!-- 文档预览弹窗 -->
	<div id="preview-modal" class="modal">
		<div class="modal-content">
			<div class="modal-header">
				<span id="preview-title" class="modal-title"></span>
				<div class="modal-actions">
					<a id="preview-visit" class="modal-visit" target="_blank" rel="noopener noreferrer">🌐 访问在线文档</a>
					<button id="preview-close" class="modal-close">✕</button>
				</div>
			</div>
			<div id="preview-body" class="modal-body"></div>
		</div>
	</div>
	<script>
		var edaObj = (typeof eda !== 'undefined') ? eda : (window.parent && window.parent.eda);
		var _i18n = {"About":"关于","EasyEDA extension SDK v":"嘉立创EDA 扩展 SDK v${1}","Open AI Assistant":"打开 AI 知识库","Settings...":"设置...","About...":"关于...","AI Knowledge Base Assistant":"AI 知识库助手","Knowledge Base":"知识库","Import Markdown Files":"导入 Markdown 文件","Clear Knowledge Base":"清空知识库","Mode:":"模式:","Online AI Q&A":"在线AI问答","Online AI Q&A Tooltip":"使用在线 AI API 生成回答","Local AI":"本地AI","Local AI Tooltip":"使用本地AI模型生成回答（无需API Key）","Keyword Search":"关键词检索","Keyword Search Tooltip":"仅检索知识库，返回匹配片段","Input your question...":"输入你的问题...","Send":"发送","Stop":"停止","Visit Online Document":"访问在线文档","AI Assistant Settings":"AI 助手设置","API Type":"API 类型","OpenAI Compatible Format":"OpenAI 兼容格式（MiniMax、DeepSeek 等）","Anthropic Format":"Anthropic 格式（Claude 等）","API Key":"API Key","Input API Key":"输入 API Key","Model Name":"模型名称","Input model name":"输入模型名称","API URL":"API 地址","API URL Placeholder":"例如 https://api.openai.com/v1","Advanced Settings":"高级设置","Embedding Model":"Embedding 模型","Embedding Model Hint":"用于文档向量化的模型，留空使用默认 Xenova/bge-large-zh-v1.5","Local AI Model":"本地 AI 模型","Local AI Model Hint":"本地推理模型，留空使用默认 onnx-community/Qwen2.5-0.5B-Instruct","Model Mirror":"模型镜像站","Model Mirror Hint":"用于下载 Embedding 和本地 AI 模型，留空使用默认 https://hf-mirror.com","Enable Thinking Mode":"启用思考模式","Enable Thinking Mode Hint":"开启后在 API 请求中添加 enable_thinking 参数（适用于 Qwen3 等支持思考模式的模型）","Context Rounds":"上下文轮数","Context Rounds Hint":"携带最近 N 轮对话作为上下文，留空默认 3 轮，设为 0 则不携带历史","Save":"保存","Settings Saved":"已保存，重新打开助手窗口生效","Settings Saved Toast":"设置已保存，重新打开助手窗口生效"};
		function t(tag, ...args) {
			if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag, undefined, undefined, ...args);
			var text = _i18n[tag] || tag;
			for (var i = 0; i < args.length; i++) text = text.replace('${' + (i+1) + '}', args[i]);
			return text;
		}
		function applyI18n() {
			var els = document.querySelectorAll('[data-i18n]');
			for (var i = 0; i < els.length; i++) { var k = els[i].getAttribute('data-i18n'); els[i].textContent = t(k); }
			var titles = document.querySelectorAll('[data-i18n-title]');
			for (var i = 0; i < titles.length; i++) { var k = titles[i].getAttribute('data-i18n-title'); titles[i].title = t(k); }
			var phs = document.querySelectorAll('[data-i18n-placeholder]');
			for (var i = 0; i < phs.length; i++) { var k = phs[i].getAttribute('data-i18n-placeholder'); phs[i].placeholder = t(k); }
		}
		applyI18n();
		// Apply i18n to elements with special formatting (emojis, etc.)
		document.title = t('AI Knowledge Base Assistant');
		document.querySelector('#sidebar h3').textContent = '📚 ' + t('Knowledge Base');
		document.querySelector('.upload-btn').textContent = '📄 ' + t('Import Markdown Files');
		document.getElementById('mode-api').textContent = '🌐 ' + t('Online AI Q&A');
		document.getElementById('mode-local').textContent = '🖥️ ' + t('Local AI');
		document.getElementById('mode-index').textContent = '🔍 ' + t('Keyword Search');
		document.getElementById('preview-visit').textContent = '🌐 ' + t('Visit Online Document');
	</script>
	<script src="/iframe/app.js"></script>
</body>
</html>
