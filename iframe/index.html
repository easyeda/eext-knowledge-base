<!doctype html>
<html lang="zh-Hans">
<head>
	<title>AI 知识库助手</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="/iframe/style.css" />
</head>
<body>
	<div id="app">
		<div id="sidebar">
			<h3>📚 知识库</h3>
			<div id="upload-area">
				<label for="file-input" class="upload-btn">📄 导入 Markdown 文件</label>
				<input type="file" id="file-input" accept=".md,.markdown,.txt" multiple />
			</div>
			<div id="doc-list"></div>
			<div id="doc-stats"></div>
			<button id="clear-kb" class="btn-danger" style="display:none;">清空知识库</button>
		</div>
		<div id="main">
			<div id="mode-bar">
				<span class="mode-label">模式:</span>
				<button id="mode-api" class="mode-btn active" title="使用在线 AI API 生成回答">🌐 在线AI问答</button>
				<button id="mode-local" class="mode-btn" title="使用本地AI模型生成回答（无需API Key）">🖥️ 本地AI</button>
				<button id="mode-index" class="mode-btn" title="仅检索知识库，返回匹配片段">🔍 关键词检索</button>
			</div>
			<div id="chat-messages"></div>
			<div id="input-area">
				<textarea id="user-input" placeholder="输入你的问题..." rows="2"></textarea>
				<button id="send-btn">发送</button>
				<button id="stop-btn" style="display:none;">停止</button>
			</div>
		</div>
	</div>
	<!-- 文档预览弹窗 -->
	<div id="preview-modal" class="modal">
		<div class="modal-content">
			<div class="modal-header">
				<span id="preview-title" class="modal-title"></span>
				<div class="modal-actions">
					<a id="preview-visit" class="modal-visit" target="_blank" rel="noopener noreferrer">🌐 访问在线文档</a>
					<button id="preview-close" class="modal-close">✕</button>
				</div>
			</div>
			<div id="preview-body" class="modal-body"></div>
		</div>
	</div>
	<script>
		var edaObj = (typeof eda !== 'undefined') ? eda : (window.parent && window.parent.eda);
		function t(tag) {
			if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag);
			return tag;
		}
		// Apply i18n to page elements
		document.title = t('AI Knowledge Base Assistant');
		document.querySelector('#sidebar h3').textContent = '📚 ' + t('Knowledge Base');
		document.querySelector('.upload-btn').textContent = '📄 ' + t('Import Markdown Files');
		document.getElementById('clear-kb').textContent = t('Clear Knowledge Base');
		document.querySelector('.mode-label').textContent = t('Mode:');
		document.getElementById('mode-api').textContent = '🌐 ' + t('Online AI Q&A');
		document.getElementById('mode-api').title = t('Online AI Q&A Tooltip');
		document.getElementById('mode-local').textContent = '🖥️ ' + t('Local AI');
		document.getElementById('mode-local').title = t('Local AI Tooltip');
		document.getElementById('mode-index').textContent = '🔍 ' + t('Keyword Search');
		document.getElementById('mode-index').title = t('Keyword Search Tooltip');
		document.getElementById('user-input').placeholder = t('Input your question...');
		document.getElementById('send-btn').textContent = t('Send');
		document.getElementById('stop-btn').textContent = t('Stop');
		document.getElementById('preview-visit').textContent = '🌐 ' + t('Visit Online Document');
	</script>
	<script src="/iframe/app.js"></script>
</body>
</html>
