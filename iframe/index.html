<!doctype html>
<html lang="zh-Hans">
<head>
	<title>AI 知识库助手</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="/iframe/style.css" />
</head>
<body>
	<div id="app">
		<div id="sidebar">
			<h3>📚 知识库</h3>
			<div id="upload-area">
				<label for="file-input" class="upload-btn">📄 导入 Markdown 文件</label>
				<input type="file" id="file-input" accept=".md,.markdown,.txt" multiple />
			</div>
			<div id="doc-list"></div>
			<div id="doc-stats"></div>
			<button id="clear-kb" class="btn-danger" style="display:none;" data-i18n="Clear Knowledge Base">清空知识库</button>
		</div>
		<div id="main">
			<div id="mode-bar">
				<span class="mode-label" data-i18n="Mode:">模式:</span>
				<button id="mode-api" class="mode-btn active" title="使用在线 AI API 生成回答" data-i18n-title="Online AI Q&A Tooltip">🌐 在线AI问答</button>
				<button id="mode-local" class="mode-btn" title="使用本地AI模型生成回答（无需API Key）" data-i18n-title="Local AI Tooltip">🖥️ 本地AI</button>
				<button id="mode-index" class="mode-btn" title="仅检索知识库，返回匹配片段" data-i18n-title="Keyword Search Tooltip">🔍 关键词检索</button>
				<button id="rebuild-index" class="mode-btn rebuild-btn" title="重建本地搜索索引" data-i18n-title="Rebuild Index Tooltip" style="display:none;">🔄 <span data-i18n="Rebuild Index">重建索引</span></button>
			</div>
			<div id="vector-progress" class="vector-progress" style="display:none;">
				<div class="vector-progress-text"></div>
				<div class="vector-progress-track"><div class="vector-progress-bar"></div></div>
			</div>
			<div id="chat-messages"></div>
			<div id="input-area">
				<textarea id="user-input" placeholder="输入你的问题..." data-i18n-placeholder="Input your question..." rows="2"></textarea>
				<button id="send-btn" data-i18n="Send">发送</button>
				<button id="stop-btn" style="display:none;" data-i18n="Stop">停止</button>
			</div>
		</div>
	</div>
	<!-- 文档预览弹窗 -->
	<div id="preview-modal" class="modal">
		<div class="modal-content">
			<div class="modal-header">
				<span id="preview-title" class="modal-title"></span>
				<div class="modal-actions">
					<a id="preview-visit" class="modal-visit" target="_blank" rel="noopener noreferrer">🌐 访问在线文档</a>
					<button id="preview-close" class="modal-close">✕</button>
				</div>
			</div>
			<div id="preview-body" class="modal-body"></div>
		</div>
	</div>
	<script>
		var edaObj = (typeof eda !== 'undefined') ? eda : null;

ld Search Index":"构建搜索索引","Build":"构建","Rebuild search index? This may take a moment.":"确定重建搜索索引？可能需要一点时间。","Rebuild Search Index":"重建搜索索引","Rebuild":"重建","Rebuild Index":"重建索引","Rebuild Index Tooltip":"重建本地搜索索引","Building index, please wait...":"正在构建索引，请稍候...","Search index built (${1} chunks, ${2}s).":"搜索索引已构建（${1} 个文档块，${2} 秒）。","Index built":"索引已构建","Knowledge base is empty, nothing to index.":"知识库为空，无需构建索引。","Found ${1} matching fragments":"找到 ${1} 个匹配片段","Click to preview":"点击预览","Settings":"设置","Local Model Repository":"本地模型仓库","Chat model":"对话模型","Embedding model":"Embedding 模型","Import folder":"导入文件夹","Local Model Import Hint":"请选择完整的 Transformers.js 兼容 ONNX 模型文件夹。导入后的模型会保存在本地，并在离线模式下加载。","Rebuild vectors":"重构向量","Rebuild Vectors Hint":"切换启用的 Embedding 模型或 ONNX 精度后使用。","No imported models.":"暂无已导入模型。","Chat":"对话","Embedding":"Embedding","${1} files":"${1} 个文件","Active":"已启用","Use":"使用","Validating model by loading it offline...":"正在离线加载模型进行验证...","Model imported successfully":"模型导入成功","Select a model folder first.":"请先选择模型文件夹。","Preparing to import ${1} files...":"准备导入 ${1} 个文件...","Importing ${1}: ${2}%":"正在导入 ${1}: ${2}%","${1} imported and validated.":"${1} 已导入并验证通过。","No folder selected.":"未选择文件夹。","Selected ${1} files from ${2}. Click Import folder to continue.":"已从 ${2} 选择 ${1} 个文件，点击“导入文件夹”继续。","Local model importer ready. Select a model folder to import.":"本地模型导入器已就绪，请选择模型文件夹。","${1} precision set to ${2}. Reopen the assistant to apply.":"${1} 精度已切换为 ${2}，重新打开助手后生效。","${1} selected. Reopen the assistant to apply the change.":"${1} 已选中，重新打开助手后生效。","Select an imported Embedding model before rebuilding vectors.":"请先选择已导入的 Embedding 模型，再重构向量。","The active imported Embedding model was not found.":"未找到当前启用的本地 Embedding 模型。","Rebuild vectors for \"${1}\" (${2}) on next assistant open?":"是否在下次打开助手时为“${1}”（${2}）重构向量？","Waiting for vector rebuild confirmation...":"等待确认重构向量...","Vector rebuild canceled.":"已取消重构向量。","Vector rebuild requested for ${1}. Reopen the assistant to rebuild with progress.":"已请求为 ${1} 重构向量。重新打开助手后会显示构建进度。","Vector rebuild requested":"已请求重构向量","Delete imported model":"删除导入模型","Delete imported model \"${1}\"?":"确定删除导入模型“${1}”？","Waiting for delete confirmation for ${1}...":"等待确认删除 ${1}...","Delete canceled.":"已取消删除。","${1} deleted.":"${1} 已删除。","Model deleted":"模型已删除","Enable imported local models":"启用导入本地模型","Enable Imported Local Models Hint":"关闭时使用镜像站在线拉取的模型；开启后才使用下方选中的导入模型。","Use prebuilt vectors":"使用预构建向量","Use Prebuilt Vectors Hint":"开启后内置文档直接使用随包向量；查询和新导入文档使用当前启用的 Embedding 模型。建议与下方编译时模型和量化等级保持兼容。","Imported model selected. Enable local imported models to use it.":"已选中导入模型。请开启“启用导入本地模型”后使用。","Prebuilt vectors are enabled. Built-in vectors will be reused; no full rebuild is needed.":"已启用预构建向量。内置向量会直接复用，无需全量重构。","Enable local imported models before rebuilding imported vectors.":"请先开启“启用导入本地模型”，再重构导入模型的向量。","Selected":"已选中","Loaded cached vectors":"已加载缓存向量","Building vectors...":"正在构建向量...","Building vectors: ${1}/${2}":"正在构建向量：${1}/${2}","Embedding model selected. Disable prebuilt vectors to use it for built-in docs.":"已选中 Embedding 模型。关闭“使用预构建向量”后，它才会用于内置文档。","Rename":"重命名","Delete folder":"删除文件夹","Local Model Usage Guide":"使用说明","Local Model Usage Step 1":"默认保持“启用导入本地模型”关闭，助手会从镜像站在线拉取模型。","Local Model Usage Step 2":"需要离线模型时，先选择 Chat 或 Embedding 类型，再导入完整的 Transformers.js ONNX 模型文件夹。","Local Model Usage Step 3":"导入后点击模型行的 Use 只会选中模型；开启“启用导入本地模型”后才真正生效。","Local Model Usage Step 4":"开启“使用预构建向量”时，内置文档保持使用随包向量；当前启用的 Embedding 模型用于查询和新导入文档。","Local Model Usage Step 5":"只有关闭预构建向量，并希望用当前导入的 Embedding 模型重构内置文档时，才需要点击 Rebuild vectors。","Prebuilt Vector Build Info":"编译时模型：${1}；量化等级：${2}。","Prebuilt vectors are enabled. Built-in vectors are reused; the active Embedding model still handles queries and imported docs.":"已启用预构建向量。内置向量会直接复用；当前启用的 Embedding 模型仍会用于查询和新导入文档。","Embedding model selected. Prebuilt vectors stay enabled; this model will embed queries and imported docs.":"已选中 Embedding 模型。预构建向量保持开启；该模型将用于查询和新导入文档的向量化。","AI Generated Sources":"【Docs】AI 生成内容不一定正确，参考来源：${1}","Local AI Generated Sources":"【Docs】本地 AI 生成内容仅供参考，参考来源：${1}","Failed to read file: ${1}":"【WARN】读取文件失败：${1}"};
		function t(tag, ...args) {
			if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag, undefined, undefined, ...args);
			var text = _i18n[tag] || tag;
			for (var i = 0; i < args.length; i++) text = text.replace('${' + (i+1) + '}', args[i]);
			return text;
		}
		function applyI18n() {
			var els = document.querySelectorAll('[data-i18n]');
			for (var i = 0; i < els.length; i++) { var k = els[i].getAttribute('data-i18n'); els[i].textContent = t(k); }
			var titles = document.querySelectorAll('[data-i18n-title]');
			for (var i = 0; i < titles.length; i++) { var k = titles[i].getAttribute('data-i18n-title'); titles[i].title = t(k); }
			var phs = document.querySelectorAll('[data-i18n-placeholder]');
			for (var i = 0; i < phs.length; i++) { var k = phs[i].getAttribute('data-i18n-placeholder'); phs[i].placeholder = t(k); }
		}
		applyI18n();
		// Apply i18n to elements with special formatting (emojis, etc.)
		document.title = t('AI Knowledge Base Assistant');
		document.querySelector('#sidebar h3').textContent = '📚 ' + t('Knowledge Base');
		document.querySelector('.upload-btn').textContent = '📄 ' + t('Import Markdown Files');
		document.getElementById('mode-api').textContent = '🌐 ' + t('Online AI Q&A');
		document.getElementById('mode-local').textContent = '🖥️ ' + t('Local AI');
		document.getElementById('mode-index').textContent = '🔍 ' + t('Keyword Search');
		document.getElementById('preview-visit').textContent = '🌐 ' + t('Visit Online Document');
		var rebuildLabel = document.querySelector('#rebuild-index [data-i18n]');
		if (rebuildLabel) rebuildLabel.textContent = t('Rebuild Index');
	</script>
	<script src="/iframe/app.js"></script>
</body>
</html>
